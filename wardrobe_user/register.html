<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 网上衣橱</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css?v=3.0">
    <link rel="stylesheet" href="css/ai-assistant.css?v=3.0">
    <style>#particle-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none;background:transparent}</style>
</head>
<body>
    <div id="app">
        <!-- 头部导航容器 -->
        <div id="header-container"></div>

        <!-- 主要内容 -->
        <main id="main-container">
            <div class="register-container">
                <div class="box-card">
                    <h1>用户注册</h1>
                    <form id="register-form" onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label for="name">用户名</label>
                            <input type="text" id="name" name="name" required placeholder="请输入用户名" minlength="2" maxlength="10"/>
                        </div>
                        <div class="form-group">
                            <label for="password">密码</label>
                            <input type="password" id="password" name="password" required placeholder="请输入密码" minlength="6" maxlength="16"/>
                        </div>
                        <div class="form-group">
                            <label for="phone">手机号</label>
                            <input type="tel" id="phone" name="phone" required placeholder="请输入手机号码" pattern="1[34578]\d{9}"/>
                        </div>
                        <div class="form-group">
                            <label for="address">地址</label>
                            <input type="text" id="address" name="address" required placeholder="请输入详细地址"/>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="el-button el-button--primary">注册</button>
                            <button type="button" class="el-button el-button--info" onclick="resetForm()">重置</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <!-- 底部容器 -->
        <div id="footer-container"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components-loader.js"></script>
    <script src="js/particles.js"></script>

    <script>
        // 处理注册
        async function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;

            if (!Utils.validateRequired(name)) {
                Utils.showAlert('请输入用户名', 'error');
                return;
            }

            if (name.length < 2 || name.length > 10) {
                Utils.showAlert('用户名长度在 2 至 10 个字符', 'error');
                return;
            }

            if (!Utils.validateRequired(password) || password.length < 6 || password.length > 16) {
                Utils.showAlert('密码长度为 6 至 16 个字符', 'error');
                return;
            }

            if (!Utils.validateRequired(phone) || !Utils.validatePhone(phone)) {
                Utils.showAlert('请输入正确的手机号码', 'error');
                return;
            }

            if (!Utils.validateRequired(address)) {
                Utils.showAlert('请输入地址', 'error');
                return;
            }

            const data = {
                userName: name,
                password: password,
                phone: phone,
                address: address
            };

            try {
                const result = await API.register(data);
                Utils.showAlert(result || '注册成功', 'success');
                resetForm();
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (error) {
                console.error('Register failed:', error);
                Utils.showAlert('注册失败', 'error');
            }
        }

        // 重置表单
        function resetForm() {
            document.getElementById('register-form').reset();
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', function() {
            // 初始化组件（头部和底部）
            ComponentLoader.init('register.html');
            // 如果已经登录，跳转到首页
            if (Store.isAuthenticated()) {
                window.location.href = 'home.html';
            }
        });
    </script>
    <script src="js/components/ai-assistant.js"></script>
    <script>AIAssistant.init();</script>
</body>
</html>
