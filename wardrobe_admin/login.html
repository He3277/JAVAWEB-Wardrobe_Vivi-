<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - Vivi Style</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="../wardrobe_user/css/style.css?v=3.0">
</head>
<body>
    <div id="app">
        <div id="header-container">
            <header class="el-header">
                <ul class="el-menu">
                    <li class="el-menu-item index-0">
                        <img style="height: 40px;" src="../wardrobe_user/assets/logo.png" alt="Vivi Style"/>
                    </li>
                    <li class="el-menu-item index-1" style="color:#fff;font-size:16px;font-weight:bold;">Vivi Style 后台管理</li>
                </ul>
            </header>
        </div>

        <main id="main-container">
            <div class="login-container">
                <div class="box-card">
                    <h1>管理员登录</h1>
                    <form id="login-form" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label for="userInfo">用户名</label>
                            <input type="text" id="userInfo" name="userInfo" required placeholder="请输入管理员用户名"/>
                        </div>
                        <div class="form-group">
                            <label for="password">密码</label>
                            <input type="password" id="password" name="password" required placeholder="请输入密码"/>
                        </div>
                        <div id="login-error" style="color:#F56C6C;font-size:13px;margin-bottom:10px;display:none;"></div>
                        <div class="form-actions">
                            <button type="submit" class="el-button el-button--primary">登录</button>
                            <button type="button" class="el-button el-button--info" onclick="resetForm()">重置</button>
                        </div>
                        <div style="text-align: center; margin-top: 15px;">
                            <a href="../wardrobe_user/login.html" style="color: #409EFF; font-size: 13px; text-decoration: none;">用户登录</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <div id="footer-container">
            <footer class="el-footer">
                <div class="footer">
                    <div class="footer-container">
                        <p>&copy; 2026 Vivi Style 版权所有</p>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="admin-config.js"></script>
    <script src="admin-utils.js"></script>
    <script src="admin-api.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            var userInfo = document.getElementById('userInfo').value.trim();
            var password = document.getElementById('password').value.trim();
            var errorDiv = document.getElementById('login-error');

            if (!userInfo || !password) {
                errorDiv.textContent = '请输入用户名和密码';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';

            try {
                var res = await AdminAPI.login(userInfo, password);

                if (res && typeof res === 'object' && res.userName) {
                    if (res.role !== 1) {
                        errorDiv.textContent = '该账号无管理员权限';
                        errorDiv.style.display = 'block';
                        return;
                    }
                    AdminUtils.setUser(res);
                    showMsg('登录成功！', 'success');
                    setTimeout(function() {
                        window.location.href = 'home.html';
                    }, 800);
                } else {
                    errorDiv.textContent = res || '用户名或密码错误';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Login failed:', error);
                errorDiv.textContent = '登录失败，请检查网络连接';
                errorDiv.style.display = 'block';
            }
        }

        function resetForm() {
            document.getElementById('login-form').reset();
            document.getElementById('login-error').style.display = 'none';
        }

        function showMsg(msg, type) {
            var existing = document.querySelector('.alert');
            if (existing) existing.remove();
            var div = document.createElement('div');
            div.className = 'alert alert-' + type;
            div.textContent = msg;
            document.body.insertBefore(div, document.body.firstChild);
            setTimeout(function() { div.remove(); }, 2000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (AdminUtils.isAuthenticated()) {
                window.location.href = 'home.html';
            }
        });
    </script>
</body>
</html>
